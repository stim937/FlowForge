server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: data-api-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/flowforge}
    username: ${SPRING_DATASOURCE_USERNAME:flowforge}
    password: ${SPRING_DATASOURCE_PASSWORD:flowforge}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  kafka:
    topics:
      requested: ${APP_KAFKA_TOPICS_REQUESTED:data.process.requested}
      retry: ${APP_KAFKA_TOPICS_RETRY:data.process.retry}
