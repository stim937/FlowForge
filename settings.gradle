pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        mavenCentral()
    }
}

rootProject.name = 'event-driven-data-platform'

include 'libs:common-event'
include 'libs:common-domain'
include 'services:data-api-service'
include 'services:data-worker-service'
