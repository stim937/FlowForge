global:
  namespace: event-platform

config:
  postgres:
    host: postgres
    port: "5432"
    db: flowforge
    user: flowforge
    password: flowforge
  redis:
    host: redis
    port: "6379"
  kafka:
    clusterName: flowforge-kafka
    bootstrapServers: flowforge-kafka-kafka-bootstrap:9092
    version: 4.2.0
    metadataVersion: 4.2-IV1
  topics:
    requested: data.process.requested
    retry: data.process.retry
    completed: data.process.completed
    failed: data.process.failed
    dlq: data.process.dlq
    notificationRequested: notification.requested
  worker:
    consumerGroup: data-worker-group
    maxRetryCount: "3"

dataApiService:
  replicas: 2
  image:
    repository: flowforge-data-api-service
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 8080
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    cpuAverageUtilization: 60
    memoryAverageUtilization: 75

dataWorkerService:
  replicas: 1
  image:
    repository: flowforge-data-worker-service
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 8081
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  keda:
    enabled: true
    minReplicaCount: 1
    maxReplicaCount: 10
    lagThreshold: "100"
    pollingInterval: 15
    cooldownPeriod: 60

postgres:
  image: postgres:16-alpine
  storage: 2Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

redis:
  image: redis:7-alpine
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

kafka:
  enabled: true
  nodePool:
    name: dual-role
    replicas: 1
    storage:
      type: ephemeral
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "1"
        memory: 2Gi
  exporter:
    enabled: true
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

ingress:
  enabled: true
  className: nginx
  host: flowforge.local

prometheus:
  image: prom/prometheus:v2.53.0
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

grafana:
  image: grafana/grafana:11.1.0
  adminUser: admin
  adminPassword: admin
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
