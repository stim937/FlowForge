global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: data-api-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - data-api-service:8080

  - job_name: data-worker-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - data-worker-service:8081
